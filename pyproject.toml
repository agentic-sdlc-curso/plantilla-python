[project]
name = "curso-agentic-python"
version = "0.1.0"
description = "API de gestión de solicitudes — proyecto de prácticas del curso Agentic Software Development con GitHub Copilot"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "tests"]
